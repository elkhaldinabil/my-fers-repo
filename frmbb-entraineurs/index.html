<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Espace Entraîneurs FRMBB</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{
  --g:#1D5FBF;--g2:#4C9BEA;--gold:#A88412;--gold2:#F2C14E;--bg:#F4F7FC;--card:#ffffff;--text:#122033;--muted:#63718A;--line:#E1E8F3;--soft:#EAF0F9;
  --ok:#16A34A;--okbg:#E7F7EE;--no:#DC2626;--nobg:#FDECEC;--wait:#B76A05;--waitbg:#FEF3E2;--info:#2563A8;--infobg:#E8F0FA;
  --onG:#ffffff;--goldTxt:#7A600C;--goldBg:#F3EED9;
  --fb:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;--fa:Tajawal,Poppins,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1420;--card:#16202F;--text:#E8EEF7;--muted:#9AA8BE;--line:#26344A;--soft:#1C2738;
  --ok:#4ADE80;--okbg:#14301F;--no:#F87171;--nobg:#3A1A1A;--wait:#F5B451;--waitbg:#3A2A10;--info:#7FB3EE;--infobg:#172636;
  --goldTxt:#E6C76A;--goldBg:#2E2814;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1420;--card:#16202F;--text:#E8EEF7;--muted:#9AA8BE;--line:#26344A;--soft:#1C2738;
  --ok:#4ADE80;--okbg:#14301F;--no:#F87171;--nobg:#3A1A1A;--wait:#F5B451;--waitbg:#3A2A10;--info:#7FB3EE;--infobg:#172636;
  --goldTxt:#E6C76A;--goldBg:#2E2814;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:var(--fb);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
html[lang="ar"] body{font-family:var(--fa);font-size:15px}
.in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}

/* Barre */
.nav{background:var(--g);color:var(--onG)}
.nav .in{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:74px;flex-wrap:wrap;padding-block:8px}
.logo{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}
.logo img{height:52px;width:auto}
.logo b{display:block;color:var(--gold2);letter-spacing:3px;font-size:19px;line-height:1.1}
.logo small{font-size:11px;opacity:.8}
.links{display:flex;gap:4px;flex-wrap:wrap}
.links a{color:var(--onG);text-decoration:none;padding:8px 14px;border-radius:10px;font-size:14px;opacity:.82}
.links a[aria-current="page"]{background:rgba(255,255,255,.13);opacity:1;font-weight:500}
.lang{display:inline-flex;background:rgba(255,255,255,.1);border-radius:10px;padding:3px;gap:2px}
.lang button{border:0;background:transparent;color:var(--onG);padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;opacity:.8}
.lang button[aria-pressed="true"]{background:var(--gold2);color:var(--g);opacity:1}

/* Bandeau */
.hero{background:linear-gradient(155deg,var(--g) 0%,var(--g2) 100%);color:var(--onG);padding-block:26px 86px;position:relative;overflow:hidden;border-top:1px solid rgba(255,255,255,.08)}
.hero .in{position:relative}
.hero .in>*:not(.art){max-width:min(640px,100%);position:relative;z-index:1}
.art{position:absolute;inset-inline-end:max(16px,env(safe-area-inset-right,0px));top:-16px;width:230px;height:auto;pointer-events:none}
html[dir=rtl] .art{transform:scaleX(-1)}
@media (max-width:860px){.art{width:190px;opacity:.28;top:-8px}}
.hero h1{font-size:27px;font-weight:600;margin:0;text-wrap:balance}
.hero p{opacity:.82;margin:4px 0 0;font-size:14px;max-width:66ch}
.eyebrow{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold2);font-weight:600;margin-bottom:6px}
html[lang="ar"] .eyebrow{letter-spacing:0}
.wrap{margin-top:-58px;position:relative;z-index:1;padding-bottom:40px}

.card{background:var(--card);border-radius:18px;padding:22px;border:1px solid var(--line)}
h2{font-size:18px;font-weight:600;color:var(--g);margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
:root[data-theme="dark"] h2{color:var(--gold2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h2{color:var(--gold2)}}
h3{font-size:15px;font-weight:600;margin:0 0 10px}
.muted{color:var(--muted)}
.btn{border:0;border-radius:11px;padding:11px 18px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn.p{background:var(--g);color:var(--onG)}
.btn.gold{background:var(--gold2);color:var(--g)}
.btn.ghost{background:var(--soft);color:var(--text)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Étapes */
.steps{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;overflow-x:auto;scrollbar-width:none}
.steps button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);padding:9px 14px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;display:flex;gap:8px;align-items:center}
.steps button i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:11px;font-weight:700}
.steps button[aria-current="step"]{background:var(--g);color:var(--onG)}
.steps button[aria-current="step"] i{background:var(--gold2);color:var(--g)}
.steps button.done i{background:var(--okbg);color:var(--ok)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label{font-size:12.5px;font-weight:500;color:var(--muted)}
.f label b{color:var(--no)}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:14px}
.f textarea{min-height:90px;resize:vertical}
.f input[type=checkbox],.check input{width:auto;flex:0 0 auto;margin:2px 0 0;accent-color:var(--g)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--gold2);outline:none;box-shadow:0 0 0 3px rgba(29,95,191,.18)}
.f .hint{font-size:11.5px;color:var(--muted)}
.f.err input,.f.err select{border-color:var(--no)}
.f .msg{font-size:11.5px;color:var(--no)}
.photo{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ph{width:96px;height:118px;border-radius:14px;background:var(--soft);border:1.5px dashed var(--line);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:11px;text-align:center}
.ph img{width:100%;height:100%;object-fit:cover}
.rep{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;background:var(--bg)}
.rep .rh{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px;color:var(--goldTxt)}
.rm{border:0;background:var(--nobg);color:var(--no);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
.stack{display:grid;gap:12px}
.up{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:16px;display:flex;gap:12px;align-items:center;cursor:pointer;background:var(--bg);position:relative;min-width:0}
.drop:hover{border-color:var(--gold2)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .ico{width:42px;height:42px;border-radius:11px;background:var(--goldBg);color:var(--goldTxt);display:grid;place-items:center;flex:0 0 42px}
.drop b{display:block;font-size:13.5px}
.drop small{color:var(--muted);font-size:11.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop.has{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.drop.has .ico{background:var(--ok);color:#fff}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;margin-top:18px;align-items:start}
.side{display:grid;gap:16px}
.tip{background:linear-gradient(155deg,var(--g),var(--g2));color:var(--onG);border:0}
.tip h3{color:var(--gold2)}
.tip li{margin-bottom:6px;font-size:13px;opacity:.92}
.tip ul{margin:0;padding-inline-start:18px}
.prog{height:8px;background:var(--soft);border-radius:8px;overflow:hidden}
.prog div{height:100%;background:var(--gold2);border-radius:8px;transition:width .3s}
.review dl{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:8px 14px;margin:0}
.review dt{color:var(--muted);font-size:13px}.review dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.review section{border-bottom:1px solid var(--line);padding-block:14px}
.review section:last-child{border-bottom:0}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:13px}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:20px;white-space:nowrap}
.badge:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-ok{color:var(--ok);background:var(--okbg)}.b-wait{color:var(--wait);background:var(--waitbg)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:11px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
footer{text-align:center;font-size:12px;color:var(--muted);padding-block:0 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.note{font-size:12px;color:var(--muted);margin-top:10px}

@media (max-width:900px){.layout{grid-template-columns:1fr}}
@media (max-width:560px){.hero h1{font-size:22px}.review dl{grid-template-columns:1fr}.review dt{margin-top:6px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

async function shrink(f) {
  if (!f || !/^image\/(jpeg|png|webp|heic|heif)/i.test(f.type) || f.size < 600000) return f;
  try {
    const bmp = await createImageBitmap(f); const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.8));
    return b ? new File([b], f.name.replace(/\.\w+$/, '') + '.jpg', {type:'image/jpeg'}) : f;
  } catch (_) { return f; }
}

  add('_autoresponse', 'Merci, votre dossier d’inscription a bien été reçu par la Direction Technique Nationale de la FRMBB. Vous serez informé(e) après sa validation.');
  rows.forEach(([n, v]) => add(n, v));
  add('donnees_json', 'FRMBBJSON' + JSON.stringify(data) + 'FINJSON');
  let total = 0;
  const addFiles = async (n, list) => { const dt = new DataTransfer(); for (const f of list) { const s = await shrink(f); total += s.size; dt.items.add(s); } if (!list.length) return; const i = document.createElement('input'); i.type = 'file'; i.name = n; i.multiple = list.length > 1; i.files = dt.files; form.appendChild(i); };
  try {
    await addFiles('photo', FILES.photo ? [FILES.photo] : []); await addFiles('cin', FILES.cin); await addFiles('licence', FILES.lic); await addFiles('passeport', FILES.pass);
    for (let k = 0; k < FILES.dip.length; k++) await addFiles('diplome_' + (k+1), [FILES.dip[k]]);
  } catch (_) {}
  if (total > 9.5e6) { btn.disabled = false; btn.textContent = t('submit'); toast(t('too_big')); return; }
  document.body.appendChild(form); form.submit();
});
try { const s = localStorage.getItem('frmbb-lang'); if (s && T[s]) L = s; } catch (_) {}
route();
</script>
