<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">
    Coûts d'Assurance Automobile
  </text>
  
  <!-- Chart Container -->
  <rect x="80" y="70" width="640" height="280" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Y-axis labels -->
  <text x="60" y="100" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#64748b">100%</text>
  <text x="60" y="170" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#64748b">75%</text>
  <text x="60" y="240" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#64748b">50%</text>
  <text x="60" y="310" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#64748b">25%</text>
  
  <!-- Grid lines -->
  <line x1="80" y1="100" x2="720" y2="100" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
  <line x1="80" y1="170" x2="720" y2="170" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
  <line x1="80" y1="240" x2="720" y2="240" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
  <line x1="80" y1="310" x2="720" y2="310" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Bars -->
  <!-- Sinistres Corporels -->
  <rect x="120" y="110" width="100" height="220" rx="6" fill="url(#barGrad1)"/>
  <text x="170" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Sinistres</text>
  <text x="170" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Corporels</text>
  <text x="170" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">45%</text>
  
  <!-- Rentes -->
  <rect x="280" y="150" width="100" height="180" rx="6" fill="url(#barGrad2)"/>
  <text x="330" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Rentes</text>
  <text x="330" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">&amp; Long terme</text>
  <text x="330" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">35%</text>
  
  <!-- Contentieux -->
  <rect x="440" y="200" width="100" height="130" rx="6" fill="url(#barGrad3)"/>
  <text x="490" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Contentieux</text>
  <text x="490" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Post-accident</text>
  <text x="490" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#059669">20%</text>
  
  <!-- Highlight box -->
  <rect x="570" y="90" width="140" height="90" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="640" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#92400e">COÛT TOTAL</text>
  <text x="640" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">€€€€€</text>
  <text x="640" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Par sinistre grave</text>
  
  <!-- Legend -->
  <rect x="80" y="365" width="16" height="16" rx="4" fill="#1e40af"/>
  <text x="104" y="377" font-family="Arial, sans-serif" font-size="12" fill="#475569">Sinistres corporels graves</text>
  
  <rect x="300" y="365" width="16" height="16" rx="4" fill="#dc2626"/>
  <text x="324" y="377" font-family="Arial, sans-serif" font-size="12" fill="#475569">Rentes long terme</text>
  
  <rect x="500" y="365" width="16" height="16" rx="4" fill="#059669"/>
  <text x="524" y="377" font-family="Arial, sans-serif" font-size="12" fill="#475569">Contentieux</text>
</svg>
