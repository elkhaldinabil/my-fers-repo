<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <!-- Background -->
  <rect width="400" height="250" fill="#F8FAFC"/>
  
  <!-- Central person illustration -->
  <circle cx="200" cy="100" r="50" fill="#DBEAFE" stroke="#1E40AF" stroke-width="3"/>
  <circle cx="200" cy="85" r="20" fill="#1E40AF"/>
  <path d="M170 130Q200 150 230 130" stroke="#1E40AF" stroke-width="3" fill="none"/>
  
  <!-- Protection shield around person -->
  <path d="M200 40L260 60V100C260 140 200 170 200 170C200 170 140 140 140 100V60L200 40Z" fill="none" stroke="#059669" stroke-width="4" stroke-dasharray="8 4"/>
  
  <!-- Benefit icons around -->
  <!-- Fast response -->
  <g transform="translate(80, 50)">
    <circle cx="0" cy="0" r="30" fill="#059669"/>
    <path d="M-12 0L-4 8L12 -8" stroke="white" stroke-width="3" fill="none"/>
    <text x="0" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#059669" font-weight="bold">RAPIDE</text>
  </g>
  
  <!-- Safety -->
  <g transform="translate(290, 50)">
    <circle cx="0" cy="0" r="30" fill="#3B82F6"/>
    <path d="M0 -15L8 -5L-5 5L-8 -5L0 -15Z" fill="white" transform="rotate(45)"/>
    <text x="0" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#3B82F6" font-weight="bold">SÛR</text>
  </g>
  
  <!-- Heart/Health -->
  <g transform="translate(80, 160)">
    <circle cx="0" cy="0" r="30" fill="#DC2626"/>
    <path d="M-10 5C-10 0 -5 -5 0 -5C5 -5 10 0 10 5C10 12 0 18 0 18C0 18 -10 12 -10 5Z" fill="white"/>
    <text x="0" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#DC2626" font-weight="bold">SANTÉ</text>
  </g>
  
  <!-- Peace of mind -->
  <g transform="translate(290, 160)">
    <circle cx="0" cy="0" r="30" fill="#F59E0B"/>
    <circle cx="0" cy="-5" r="8" fill="white"/>
    <path d="M-10 8C-5 12 5 12 10 8" stroke="white" stroke-width="3" fill="none"/>
    <text x="0" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#F59E0B" font-weight="bold">PAIX</text>
  </g>
  
  <!-- Title -->
  <text x="200" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E40AF">Bénéfices pour l'assuré</text>
</svg>
