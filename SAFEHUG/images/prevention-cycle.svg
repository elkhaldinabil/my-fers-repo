<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" fill="none">
  <!-- Background -->
  <rect width="500" height="200" fill="#F8FAFC"/>
  
  <!-- Circular cycle diagram -->
  <circle cx="250" cy="100" r="70" fill="none" stroke="#1E40AF" stroke-width="3" stroke-dasharray="10 5"/>
  
  <!-- Cycle arrows -->
  <path d="M250 40A60 60 0 0 1 302 70" stroke="#3B82F6" stroke-width="4" fill="none" stroke-linecap="round"/>
  <polygon points="302,70 295,62 308,65" fill="#3B82F6"/>
  
  <path d="M302 130A60 60 0 0 1 250 160" stroke="#059669" stroke-width="4" fill="none" stroke-linecap="round"/>
  <polygon points="250,160 257,152 245,155" fill="#059669"/>
  
  <path d="M250 160A60 60 0 0 1 198 130" stroke="#F59E0B" stroke-width="4" fill="none" stroke-linecap="round"/>
  <polygon points="198,130 205,138 192,135" fill="#F59E0B"/>
  
  <path d="M198 70A60 60 0 0 1 250 40" stroke="#DC2626" stroke-width="4" fill="none" stroke-linecap="round"/>
  <polygon points="250,40 243,48 255,45" fill="#DC2626"/>
  
  <!-- Center text -->
  <circle cx="250" cy="100" r="30" fill="#1E40AF"/>
  <text x="250" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">SAFE</text>
  <text x="250" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">HUG</text>
  
  <!-- Step icons -->
  <!-- Prevention -->
  <g transform="translate(250, 25)">
    <circle cx="0" cy="0" r="25" fill="#3B82F6"/>
    <path d="M-15 5L-5 15L15 -10" stroke="white" stroke-width="3" fill="none"/>
    <text x="0" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#3B82F6" font-weight="bold">PRÉVENTION</text>
  </g>
  
  <!-- Protection -->
  <g transform="translate(325, 100)">
    <circle cx="0" cy="0" r="25" fill="#059669"/>
    <path d="M0 -15L8 -5L-5 5L-8 -5L0 -15Z" fill="white" transform="rotate(45)"/>
    <text x="0" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#059669" font-weight="bold">PROTECTION</text>
  </g>
  
  <!-- Response -->
  <g transform="translate(250, 175)">
    <circle cx="0" cy="0" r="25" fill="#F59E0B"/>
    <path d="M0 -12L0 8M-8 -5L0 -12L8 -5" stroke="white" stroke-width="3" fill="none"/>
    <text x="0" y="-35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#F59E0B" font-weight="bold">RÉPONSE</text>
  </g>
  
  <!-- Care -->
  <g transform="translate(175, 100)">
    <circle cx="0" cy="0" r="25" fill="#DC2626"/>
    <rect x="-8" y="-10" width="16" height="20" rx="2" fill="white"/>
    <rect x="-10" y="-3" width="20" height="6" rx="1" fill="white"/>
    <text x="0" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#DC2626" font-weight="bold">SOINS</text>
  </g>
  
  <!-- Title -->
  <text x="250" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1E40AF" font-weight="bold">Cycle de prévention SafeHug</text>
</svg>
