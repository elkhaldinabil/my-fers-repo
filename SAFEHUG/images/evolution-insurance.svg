<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" fill="none">
  <!-- Background -->
  <rect width="500" height="200" fill="#F8FAFC"/>
  
  <!-- Title -->
  <text x="250" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E40AF">L'évolution de l'assurance</text>
  
  <!-- Timeline arrow -->
  <line x1="50" y1="150" x2="450" y2="150" stroke="#CBD5E1" stroke-width="4"/>
  <polygon points="450,150 440,145 440,155" fill="#CBD5E1"/>
  
  <!-- Stage 1: Reparation (Traditional) -->
  <g transform="translate(50, 60)">
    <circle cx="50" cy="50" r="40" fill="#64748B"/>
    <text x="50" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="white">1</text>
    <text x="50" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748B" font-weight="bold">RÉPARATION</text>
    <text x="50" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8">APRÈS le sinistre</text>
  </g>
  
  <!-- Arrow -->
  <path d="M110 100L140 100" stroke="#1E40AF" stroke-width="2"/>
  <polygon points="140,100 133,95 133,105" fill="#1E40AF"/>
  
  <!-- Stage 2: Prevention (Transition) -->
  <g transform="translate(160, 60)">
    <circle cx="50" cy="50" r="40" fill="#3B82F6"/>
    <text x="50" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="white">2</text>
    <text x="50" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#3B82F6" font-weight="bold">PRÉVENTION</text>
    <text x="50" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#93C5FD">PENDANT le sinistre</text>
  </g>
  
  <!-- Arrow -->
  <path d="M220 100L250 100" stroke="#059669" stroke-width="2"/>
  <polygon points="250,100 243,95 243,105" fill="#059669"/>
  
  <!-- Stage 3: Protection (Future) -->
  <g transform="translate(270, 60)">
    <circle cx="50" cy="50" r="40" fill="#059669"/>
    <text x="50" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="white">3</text>
    <text x="50" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#059669" font-weight="bold">PROTECTION</text>
    <text x="50" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6EE7B7">AVANT le sinistre</text>
  </g>
  
  <!-- Arrow -->
  <path d="M330 100L360 100" stroke="#F59E0B" stroke-width="2"/>
  <polygon points="360,100 353,95 353,105" fill="#F59E0B"/>
  
  <!-- Stage 4: Partnership (SafeHug) -->
  <g transform="translate(380, 60)">
    <circle cx="50" cy="50" r="40" fill="#DC2626"/>
    <path d="M35 35L65 65M65 35L35 65" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <text x="50" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#DC2626" font-weight="bold">PARTENARIAT</text>
    <text x="50" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#FCA5A5">AVEC le client</text>
  </g>
  
  <!-- Evolution arrow across top -->
  <path d="M50 35L450 35" stroke="#1E40AF" stroke-width="2" stroke-dasharray="5 3"/>
  <polygon points="450,35 445,30 445,40" fill="#1E40AF"/>
  <text x="250" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1E40AF" font-style="italic">Évolution du métier d'assureur</text>
</svg>
