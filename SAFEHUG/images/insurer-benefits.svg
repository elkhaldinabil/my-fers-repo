<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <!-- Background -->
  <rect width="400" height="250" fill="#F8FAFC"/>
  
  <!-- Central chart/graph illustration -->
  <rect x="150" y="60" width="100" height="80" rx="8" fill="#1E40AF"/>
  <line x1="170" y1="100" x2="230" y2="100" stroke="#059669" stroke-width="3"/>
  <line x1="170" y1="80" x2="210" y2="80" stroke="#059669" stroke-width="3"/>
  <line x1="170" y1="120" x2="250" y2="120" stroke="#059669" stroke-width="3"/>
  <polygon points="250,120 230,100 210,80 230,100" fill="#059669"/>
  
  <!-- Upward trend arrow -->
  <path d="M260 50L280 30L290 40L310 20" stroke="#059669" stroke-width="4" fill="none" stroke-linecap="round"/>
  <polygon points="310,20 300,25 305,35" fill="#059669"/>
  
  <!-- Coins/money stack -->
  <g transform="translate(120, 120)">
    <ellipse cx="0" cy="15" rx="25" ry="10" fill="#F59E0B"/>
    <ellipse cx="0" cy="5" rx="25" ry="10" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
    <ellipse cx="0" cy="-5" rx="25" ry="10" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
    <text x="0" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#F59E0B" font-weight="bold">ÉCONOMIES</text>
  </g>
  
  <!-- Cost reduction -->
  <g transform="translate(270, 120)">
    <circle cx="0" cy="0" r="35" fill="#DC2626"/>
    <line x1="-20" y1="-20" x2="20" y2="20" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <text x="0" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#DC2626" font-weight="bold">MOINS DE</text>
    <text x="0" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#DC2626" font-weight="bold">COÛTS</text>
  </g>
  
  <!-- Risk reduction shield -->
  <g transform="translate(200, 180)">
    <path d="M0 -30L30 0V20C30 50 0 70 0 70C0 70 -30 50 -30 20V0L0 -30Z" fill="none" stroke="#059669" stroke-width="3"/>
    <path d="M-15 20L0 5L15 20L10 20L10 40L-10 40L-10 20Z" fill="#059669"/>
    <text x="0" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#059669" font-weight="bold">MOINS DE RISQUES</text>
  </g>
  
  <!-- Benefit icons top -->
  <g transform="translate(50, 60)">
    <circle cx="0" cy="0" r="20" fill="#059669"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">€</text>
  </g>
  
  <g transform="translate(330, 60)">
    <circle cx="0" cy="0" r="20" fill="#3B82F6"/>
    <path d="M-10 5L0 -8L10 5" stroke="white" stroke-width="3" fill="none"/>
    <line x1="0" y1="-8" x2="0" y2="12" stroke="white" stroke-width="3"/>
    <text x="0" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#3B82F6" font-weight="bold">GROWTH</text>
  </g>
  
  <!-- Title -->
  <text x="200" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E40AF">Bénéfices pour l'assureur</text>
</svg>
