<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background -->
  <rect width="400" height="300" fill="#F8FAFC"/>
  
  <!-- Car seat belt strap -->
  <path d="M50 50C50 30 70 20 100 20H300C330 20 350 30 350 50V250C350 270 330 280 300 280H100C70 280 50 270 50 250V50Z" fill="#1E40AF" stroke="#0F172A" stroke-width="3"/>
  
  <!-- Belt texture lines -->
  <path d="M80 40V260" stroke="#3B82F6" stroke-width="2" stroke-dasharray="10 10"/>
  <path d="M120 40V260" stroke="#3B82F6" stroke-width="2" stroke-dasharray="10 10"/>
  <path d="M280 40V260" stroke="#3B82F6" stroke-width="2" stroke-dasharray="10 10"/>
  <path d="M320 40V260" stroke="#3B82F6" stroke-width="2" stroke-dasharray="10 10"/>
  
  <!-- Buckle -->
  <rect x="160" y="100" width="80" height="100" rx="10" fill="#64748B" stroke="#475569" stroke-width="3"/>
  <rect x="170" y="110" width="60" height="80" rx="5" fill="#94A3B8"/>
  <rect x="185" y="140" width="30" height="30" rx="5" fill="#1E293B"/>
  
  <!-- SafeHug card slot -->
  <rect x="120" y="70" width="160" height="50" rx="8" fill="#DC2626" stroke="#B91C1C" stroke-width="2"/>
  <rect x="130" y="78" width="140" height="34" rx="4" fill="white"/>
  
  <!-- Card content -->
  <rect x="135" y="83" width="40" height="24" rx="2" fill="#DBEAFE"/>
  <rect x="185" y="85" width="80" height="6" rx="2" fill="#E2E8F0"/>
  <rect x="185" y="95" width="60" height="4" rx="2" fill="#CBD5E1"/>
  
  <!-- Heart cross icon on card -->
  <circle cx="155" cy="95" r="12" fill="#DC2626"/>
  <rect x="151" y="89" width="8" height="14" rx="1" fill="white"/>
  <rect x="146" y="94" width="18" height="8" rx="1" fill="white"/>
  
  <!-- Labels -->
  <text x="200" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E40AF">CEINTURE SAFEHUG</text>
  <text x="200" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748B">Carte d'urgence intégrée</text>
  
  <!-- Decorative elements -->
  <circle cx="40" cy="150" r="15" fill="#DC2626" opacity="0.2"/>
  <circle cx="360" cy="150" r="15" fill="#3B82F6" opacity="0.2"/>
</svg>
